name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm run build

      - run: npm run lint:firefox

      - run: npm run package

      - uses: actions/upload-artifact@v4
        with:
          name: pwdsafe-firefox
          path: dist/firefox

      - uses: actions/upload-artifact@v4
        with:
          name: pwdsafe-chrome
          path: dist/chrome

      - uses: actions/upload-artifact@v4
        with:
          name: extension-zips
          path: artifacts/*.zip

      - name: Attach zips to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
